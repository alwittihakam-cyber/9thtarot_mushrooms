name: check
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Validate data and run tests
        run: pytest -q
      - name: Rebuild results
        run: |
          python analysis/build.py
          python analysis/power.py
      - name: Results must match the committed data
        # Figures are excluded: font rendering differs between machines.
        run: git diff --exit-code -- results/*.csv results/*.md results/*.json
